<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HR Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar {
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        .stat-card {
            border: none;
            border-radius: 15px;
            color: white;
            transition: .3s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }

        .content-card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-speedometer2"></i>
                HR Dashboard
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active"
                            href="#"
                            onclick="showSection('dashboard')">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="#"
                            onclick="showSection('regions')">
                            Regions
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="#"
                            onclick="showSection('countries')">
                            Countries
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <!-- DASHBOARD -->
        <div id="dashboard" class="section active">

            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card stat-card bg-primary">
                        <div class="card-body text-center">
                            <i class="bi bi-people-fill fs-1"></i>
                            <h5>Employees</h5>
                            <div id="emp" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-success">
                        <div class="card-body text-center">
                            <i class="bi bi-building fs-1"></i>
                            <h5>Departments</h5>
                            <div id="dpt" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-warning">
                        <div class="card-body text-center">
                            <i class="bi bi-briefcase-fill fs-1"></i>
                            <h5>Jobs</h5>
                            <div id="jb" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-danger">
                        <div class="card-body text-center">
                            <i class="bi bi-globe fs-1"></i>
                            <h5>Regions</h5>
                            <div id="rg" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-info">
                        <div class="card-body text-center">
                            <i class="bi bi-flag-fill fs-1"></i>
                            <h5>Countries</h5>
                            <div id="coun" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-secondary">
                        <div class="card-body text-center">
                            <i class="bi bi-geo-alt-fill fs-1"></i>
                            <h5>Locations</h5>
                            <div id="loc" class="stat-number">0</div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- REGIONS -->
        <div id="regions" class="section">

            <div class="card content-card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-globe-americas"></i>
                        Regions
                    </h4>
                </div>

                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Region ID</th>
                                <th>Region Name</th>
                            </tr>
                        </thead>
                        <tbody id="regionTable"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- COUNTRIES -->
        <div id="countries" class="section">

            <div class="card content-card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-flag-fill"></i>
                        Countries
                    </h4>
                </div>

                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Country ID</th>
                                <th>Country Name</th>
                                <th>Region ID</th>
                            </tr>
                        </thead>
                        <tbody id="countryTable"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const DASHBOARD_URL = "https://ideal-system-9jg9gpr9vjqf97jj-3000.app.github.dev/hrdetails";
        const REGION_URL = "https://ideal-system-9jg9gpr9vjqf97jj-3000.app.github.dev/regions";
        const COUNTRY_URL = "https://ideal-system-9jg9gpr9vjqf97jj-3000.app.github.dev/countries";

        function showSection(id) {

            document.querySelectorAll(".section")
                .forEach(section => section.classList.remove("active"));

            document.getElementById(id)
                .classList.add("active");
        }

        async function getDashboard() {

            const response = await fetch(DASHBOARD_URL);
            const data = await response.json();

            document.getElementById("emp").textContent = data[0].TotalEmp;
            document.getElementById("dpt").textContent = data[0].TotalDpt;
            document.getElementById("jb").textContent = data[0].TotalJob;
            document.getElementById("rg").textContent = data[0].TotalReg;
            document.getElementById("coun").textContent = data[0].TotalCoun;
            document.getElementById("loc").textContent = data[0].TotalLoc;
        }

        async function getRegions() {

            const response = await fetch(REGION_URL);
            const regions = await response.json();

            const tbody = document.getElementById("regionTable");

            tbody.innerHTML = regions.map(region => `
                <tr>
                    <td>${region.region_id}</td>
                    <td>${region.region_name}</td>
                </tr>
            `).join('');
        }

        async function getCountries() {

            const response = await fetch(COUNTRY_URL);
            const countries = await response.json();

            const tbody = document.getElementById("countryTable");

            tbody.innerHTML = countries.map(country => `
                <tr>
                    <td>${country.country_id}</td>
                    <td>${country.country_name}</td>
                    <td>${country.region_id}</td>
                </tr>
            `).join('');
        }

        getDashboard();
        getRegions();
        getCountries();

    </script>

</body>

</html>
