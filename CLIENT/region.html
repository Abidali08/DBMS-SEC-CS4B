<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regions | HR Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        .navbar {
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .dashboard-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
        }

        .table tbody tr {
            transition: all .2s ease;
        }

        .table tbody tr:hover {
            background-color: #f1f5ff;
            transform: scale(1.005);
        }

        .stat-badge {
            font-size: .9rem;
            padding: 8px 14px;
        }

        .search-box {
            max-width: 350px;
        }

        .loader-container {
            padding: 50px 0;
        }

        .empty-state {
            padding: 40px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 4rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-speedometer2 me-2"></i>
                HR Dashboard
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="region.html">
                            <i class="bi bi-globe me-1"></i> Regions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="country.html">
                            <i class="bi bi-flag me-1"></i>
                            Countries
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">

        <div class="card dashboard-card">

            <div class="card-header text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">
                    <i class="bi bi-globe-americas me-2"></i>
                    Regions Management
                </h4>

                <span class="badge bg-light text-dark stat-badge" id="regionCount">
                    0 Regions
                </span>
            </div>

            <div class="card-body">

                <!-- Search -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="input-group search-box">
                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text"
                                class="form-control"
                                id="searchRegion"
                                placeholder="Search region name...">
                        </div>
                    </div>
                </div>

                <!-- Loader -->
                <div id="loader" class="text-center loader-container">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-3 mb-0">Loading regions...</p>
                </div>

                <!-- Table -->
                <div class="table-responsive d-none" id="tableContainer">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th width="150">Region ID</th>
                                <th>Region Name</th>
                            </tr>
                        </thead>
                        <tbody id="regiondata"></tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state text-center d-none">
                    <i class="bi bi-database-x"></i>
                    <h5 class="mt-3">No Regions Found</h5>
                    <p>Try a different search term.</p>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const URL = "https://ideal-system-9jg9gpr9vjqf97jj-3000.app.github.dev/regions";

        let allRegions = [];

        async function getRegions() {

            const loader = document.getElementById("loader");
            const tableContainer = document.getElementById("tableContainer");
            const emptyState = document.getElementById("emptyState");

            try {

                loader.classList.remove("d-none");

                const response = await fetch(URL);

                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                allRegions = await response.json();

                renderTable(allRegions);

                document.getElementById("regionCount").textContent =
                    `${allRegions.length} Regions`;

                tableContainer.classList.remove("d-none");

            } catch (error) {

                emptyState.classList.remove("d-none");
                emptyState.innerHTML = `
                    <i class="bi bi-exclamation-triangle-fill text-danger"></i>
                    <h5 class="mt-3">Unable to Load Regions</h5>
                    <p>${error.message}</p>
                `;

            } finally {

                loader.classList.add("d-none");
            }
        }

        function renderTable(regions) {

            const tbody = document.getElementById("regiondata");
            const emptyState = document.getElementById("emptyState");

            if (regions.length === 0) {
                tbody.innerHTML = "";
                emptyState.classList.remove("d-none");
                return;
            }

            emptyState.classList.add("d-none");

            tbody.innerHTML = regions.map(region => `
                <tr>
                    <td>
                        <span class="badge bg-primary">
                            ${region.region_id}
                        </span>
                    </td>
                    <td class="fw-semibold">
                        ${region.region_name}
                    </td>
                </tr>
            `).join("");
        }

        document.addEventListener("DOMContentLoaded", () => {

            getRegions();

            document.getElementById("searchRegion")
                .addEventListener("input", function () {

                    const keyword = this.value.toLowerCase();

                    const filtered = allRegions.filter(region =>
                        region.region_name.toLowerCase()
                        .includes(keyword)
                    );

                    renderTable(filtered);
                });
        });
    </script>

</body>

</html>
